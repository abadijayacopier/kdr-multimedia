name: Build KDR Camera Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "src/**"
      - "server/**"
      - "public/**"
      - "capacitor.config.ts"
      - "package.json"
      - "android-native/**"
      - ".github/workflows/android.yml"

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Prepare native SRT dependencies
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          deps = '    implementation "io.github.thibaultbee.streampack:streampack-core:3.2.0"\n    implementation "io.github.thibaultbee.streampack:streampack-srt:3.2.0"\n'
          if "streampack-core:3.2.0" not in s:
              s = s.replace("dependencies {", "dependencies {\n" + deps, 1)
          p.write_text(s)
          PY

          mkdir -p android/app/src/main/java/com/kdrmultimedia/camera/srt
          cp android-native/SrtSenderConfig.kt android/app/src/main/java/com/kdrmultimedia/camera/srt/SrtSenderConfig.kt
          cp android-native/SrtSenderService.kt android/app/src/main/java/com/kdrmultimedia/camera/srt/SrtSenderService.kt
          cp android-native/KdrSrtPlugin.java android/app/src/main/java/com/kdrmultimedia/camera/srt/KdrSrtPlugin.java
          cp android-native/MainActivity.java android/app/src/main/java/com/kdrmultimedia/camera/MainActivity.java

          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permissions = [
              '    <uses-permission android:name="android.permission.CAMERA" />',
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />',
          ]
          marker = '<manifest '
          insert_at = s.find('>', s.find(marker)) + 1
          block = '\n' + '\n'.join(permissions) + '\n'
          if 'android.permission.CAMERA' not in s:
              s = s[:insert_at] + block + s[insert_at:]
          p.write_text(s)
          PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kdr-camera-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
